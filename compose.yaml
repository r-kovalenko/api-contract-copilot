services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      PGHOST: db
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [backend]
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
