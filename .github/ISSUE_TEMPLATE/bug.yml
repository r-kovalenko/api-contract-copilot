name: Bug report
description: Report unexpected behavior with a reproducible example.
labels: ["type:bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and sanitized logs
      description: Do not include API keys, tokens, or private customer data.
