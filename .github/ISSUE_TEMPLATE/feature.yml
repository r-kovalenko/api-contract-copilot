name: Feature or task
description: Define a small, testable increment.
labels: ["type:feature"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What should the user or developer be able to do?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and tests
      description: Include success, failure, and relevant boundary cases.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
