{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "github-actions",
      "directory": "/",
      "schedule": {
        "interval": "weekly"
      },
      "groups": {
        "security-fixes": {
          "applies-to": "security-updates",
          "patterns": [
            "*"
          ]
        }
      },
      "open-pull-requests-limit": 0
    },
    {
      "package-ecosystem": "pip",
      "directory": "/backend",
      "schedule": {
        "interval": "weekly"
      },
      "groups": {
        "security-fixes": {
          "applies-to": "security-updates",
          "patterns": [
            "*"
          ]
        }
      },
      "open-pull-requests-limit": 0
    },
    {
      "package-ecosystem": "npm",
      "directory": "/frontend",
      "schedule": {
        "interval": "weekly"
      },
      "open-pull-requests-limit": 0,
      "groups": {
        "security-fixes": {
          "applies-to": "security-updates",
          "patterns": [
            "*"
          ]
        }
      }
    },
    {
      "package-ecosystem": "pip",
      "directory": "/security",
      "schedule": {
        "interval": "weekly"
      },
      "groups": {
        "security-fixes": {
          "applies-to": "security-updates",
          "patterns": [
            "*"
          ]
        }
      },
      "open-pull-requests-limit": 0
    }
  ]
}
