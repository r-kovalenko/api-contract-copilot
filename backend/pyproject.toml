[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "api-contract-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
    "sqlalchemy>=2.1.6,<2.2", "alembic>=1.18,<2", "psycopg[binary]>=3.3.7,<4",
    "openapi-spec-validator>=0.9,<0.10", "jsonschema-path>=0.5,<0.6", "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0,<10", "pytest-cov>=6,<8", "ruff>=0.17.3,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a disposable PostgreSQL database with pgvector"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
